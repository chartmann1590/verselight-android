name: Direct download build + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with store=direct
# (no Google Play links, no Play in-app review prompt, nothing sold through Google Play). Emulator with Google APIs (a normal phone).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Restore release keystore
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      if: env.KEYSTORE_B64 != ''
      run: |
        echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
        echo "Keystore restored."
    - name: Restore google-services.json
      env:
        SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      if: env.SERVICES_B64 != ''
      run: |
        echo "$SERVICES_B64" | base64 -d > app/google-services.json
        echo "google-services.json restored."
    - name: Verify signing files present
      run: |
        missing=0
        if [ ! -s app/upload-keystore.jks ]; then echo "::error::Missing app/upload-keystore.jks — set the ANDROID_KEYSTORE_BASE64 repo secret."; missing=1; fi
        if [ ! -s app/google-services.json ]; then echo "::error::Missing app/google-services.json — set the GOOGLE_SERVICES_JSON_BASE64 repo secret."; missing=1; fi
        if [ "$missing" -ne 0 ]; then exit 1; fi
        echo "Signing files present."
    - name: Read app version
      id: version
      run: |
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
        VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION_NAME-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        echo "App version: $VERSION_NAME ($VERSION_CODE), tag: v$VERSION_NAME-b${{ github.run_number }}"
    - name: Build direct APK (store=direct)
      env: {}
      run: |
        set -o pipefail
        ./gradlew :app:assembleRelease -Pstore=direct  --stacktrace 2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" dsk-apk/LumaVerse-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/LumaVerse-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/LumaVerse-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/LumaVerse-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (Google APIs image, like a normal phone)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_LumaVerse_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/LumaVerse-direct-release.apk
