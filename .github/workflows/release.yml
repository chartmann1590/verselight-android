name: Release

# Every push to main builds the app and publishes a GitHub Release,
# so README badges and the website "latest release" panel always
# have something fresh to show.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Don't cancel in-progress releases: every commit gets its own Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signed release build with production ads. The upload keystore and
      # google-services.json are gitignored, so CI restores them from the
      # ANDROID_KEYSTORE_BASE64 / GOOGLE_SERVICES_JSON_BASE64 repo secrets
      # (keystore passwords live in app/build.gradle.kts). Both secrets are
      # required — the job fails loudly without them so we never ship a
      # debug APK disguised as a release.
      - name: Restore release keystore
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          echo "Keystore restored."

      - name: Restore google-services.json
        if: secrets.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          echo "google-services.json restored."

      - name: Verify signing files present
        run: |
          missing=0
          if [ ! -s app/upload-keystore.jks ]; then echo "::error::Missing app/upload-keystore.jks — set the ANDROID_KEYSTORE_BASE64 repo secret."; missing=1; fi
          if [ ! -s app/google-services.json ]; then echo "::error::Missing app/google-services.json — set the GOOGLE_SERVICES_JSON_BASE64 repo secret."; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Signing files present."

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION_NAME ($VERSION_CODE), tag: v$VERSION_NAME-b${{ github.run_number }}"

      - name: Build signed release APK + AAB (production ads)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Stage release assets
        id: stage
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          # Main download: signed release APK with production AdMob ads.
          # lumaverse-latest.apk keeps a stable download URL:
          # .../releases/latest/download/lumaverse-latest.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/lumaverse-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/lumaverse-latest.apk
          if ls app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then
            cp app/build/outputs/bundle/release/*.aab "dist/" 2>/dev/null || true
          fi
          {
            echo "## LumaVerse ${{ steps.version.outputs.version_name }} (build ${{ github.run_number }})"
            echo ""
            echo "Auto-built from commit \`${{ github.sha }}\` on \`main\`."
            echo ""
            echo "- App version: \`${{ steps.version.outputs.version_name }}\` (versionCode \`${{ steps.version.outputs.version_code }}\`)"
            echo "- Signed **release** build (R8 minified) with **production AdMob ads** — download \`lumaverse-$TAG.apk\`."
            echo "- Google Play: https://play.google.com/store/apps/details?id=com.chartmann1590.verselight"
          } > dist/notes.md
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LumaVerse ${{ steps.version.outputs.version_name }} (build ${{ github.run_number }})
          body_path: dist/notes.md
          files: |
            dist/lumaverse-*.apk
            dist/*.aab
          generate_release_notes: true
          make_latest: true
          prerelease: false
