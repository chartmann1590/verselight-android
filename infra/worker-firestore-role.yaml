title: VerseLight Worker Comment Moderator
description: Legacy least-privilege permissions for comment moderation. Production uses roles/datastore.user because the Worker also creates comments and private activity records.
stage: GA
includedPermissions:
  - datastore.entities.create
  - datastore.entities.get
  - datastore.entities.list
  - datastore.entities.update
  - datastore.entities.delete
